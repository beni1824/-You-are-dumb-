<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿YOU ARE A DUMB?</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#ddd;font-family:Arial,sans-serif}
#screen1,#screen2{position:fixed;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#screen1 img,#screen2 img{width:100%;height:100%;object-fit:contain;background:#ddd}
#screen2{display:none}
#noBtn{position:fixed;left:59%;top:55%;width:12%;height:8%;background:transparent;border:none;cursor:pointer;z-index:5}
#yesBtn{position:fixed;left:28%;top:55%;width:12%;height:8%;background:transparent;border:none;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="screen1">
  <img src="¿YOU ARE A DUMB.png" alt="inicio">
  <button id="yesBtn" aria-label="yes"></button>
  <button id="noBtn" aria-label="no"></button>
</div>
<div id="screen2">
  <img src="¿YOU ARE A DUMB (1).png" alt="troll">
</div>
<script>
const noBtn=document.getElementById('noBtn');
const yesBtn=document.getElementById('yesBtn');
const s1=document.getElementById('screen1');
const s2=document.getElementById('screen2');
function moveNo(){
 const maxX=window.innerWidth-noBtn.offsetWidth;
 const maxY=window.innerHeight-noBtn.offsetHeight;
 const x=Math.random()*maxX;
 const y=Math.random()*maxY;
 noBtn.style.left=x+'px';
 noBtn.style.top=y+'px';
}
document.addEventListener('mousemove',e=>{
 const r=noBtn.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;
 const dx=e.clientX-cx;
 const dy=e.clientY-cy;
 const dist=Math.sqrt(dx*dx+dy*dy);
 if(dist<170) moveNo();
});
noBtn.addEventListener('mouseenter',()=>{moveNo();setTimeout(moveNo,60);});
yesBtn.addEventListener('click',()=>{s1.style.display='none';s2.style.display='flex';});
</script>
</body>
</html>
